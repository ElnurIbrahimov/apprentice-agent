<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030303" />
    <title>New Tab — AURA</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg: #030303;
        --s1: #0a0a0c;
        --s2: rgba(20, 20, 25, 0.6);
        --s3: rgba(30, 30, 38, 0.6);
        --b1: rgba(255, 255, 255, 0.08);
        --b2: rgba(255, 255, 255, 0.15);
        --p: #7c3aed;
        --pl: #a78bfa;
        --pl2: #e0d6ff;
        --tx: #f0eff8;
        --mu: #7a7a9d;
        --di: #3a3a5e;
        --r-sm: 6px;
        --r-md: 10px;
        --r-lg: 14px;
        --r-xl: 18px;
      }

      body {
        background: var(--bg);
        color: var(--tx);
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow-x: hidden;
      }

      /* Mesh gradient background */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse 60% 50% at 20% 30%, rgba(42, 0, 82, 0.35), transparent),
          radial-gradient(ellipse 50% 40% at 80% 70%, rgba(26, 0, 51, 0.3), transparent);
        pointer-events: none;
        z-index: 0;
      }

      #root {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 680px;
        padding: 40px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
      }

      /* Clock */
      .nt-clock {
        text-align: center;
        user-select: none;
      }
      .nt-clock-time {
        font-size: 64px;
        font-weight: 300;
        letter-spacing: -2px;
        color: var(--tx);
        line-height: 1;
      }
      .nt-clock-date {
        font-size: 15px;
        color: var(--mu);
        margin-top: 6px;
        font-weight: 400;
      }

      /* Logo */
      .nt-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        user-select: none;
      }
      .nt-logo-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: radial-gradient(circle, #e0d6ff, #7c3aed);
        box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.22), 0 0 14px rgba(167, 139, 250, 0.65);
        animation: breathe 3s ease-in-out infinite;
      }
      .nt-logo-text {
        font-size: 22px;
        font-weight: 600;
        color: rgba(224, 214, 255, 0.92);
        letter-spacing: 3px;
      }

      @keyframes breathe {
        0%, 100% { box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.22), 0 0 14px rgba(167, 139, 250, 0.65); }
        50% { box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12), 0 0 22px rgba(167, 139, 250, 0.8); }
      }

      /* Search */
      .nt-search-wrap {
        width: 100%;
        position: relative;
      }
      .nt-search {
        width: 100%;
        background: var(--s2);
        border: 1px solid var(--b1);
        border-radius: var(--r-xl);
        color: var(--tx);
        font-size: 15px;
        padding: 14px 48px 14px 20px;
        outline: none;
        font-family: inherit;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .nt-search::placeholder { color: var(--di); }
      .nt-search:focus {
        border-color: rgba(124, 58, 237, 0.5);
        box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
      }
      .nt-search-icon {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--mu);
        pointer-events: none;
      }

      /* Quick actions */
      .nt-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .nt-action {
        display: flex;
        align-items: center;
        gap: 7px;
        background: var(--s2);
        border: 1px solid var(--b1);
        border-radius: var(--r-lg);
        color: var(--mu);
        padding: 10px 18px;
        font-size: 13px;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.15s;
        user-select: none;
      }
      .nt-action:hover {
        border-color: rgba(124, 58, 237, 0.4);
        color: var(--tx);
        background: rgba(124, 58, 237, 0.08);
      }
      .nt-action-icon {
        font-size: 16px;
        line-height: 1;
      }

      /* Recent conversations */
      .nt-recent {
        width: 100%;
      }
      .nt-recent-title {
        font-size: 11px;
        color: var(--di);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 10px;
        font-weight: 500;
      }
      .nt-recent-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .nt-recent-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 14px;
        background: transparent;
        border: 1px solid transparent;
        border-radius: var(--r-md);
        color: var(--mu);
        font-size: 12.5px;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.12s;
        text-align: left;
        width: 100%;
        overflow: hidden;
      }
      .nt-recent-item:hover {
        background: var(--s2);
        border-color: var(--b1);
        color: var(--tx);
      }
      .nt-recent-item-text {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .nt-recent-item-time {
        font-size: 10px;
        color: var(--di);
        flex-shrink: 0;
      }
      .nt-recent-empty {
        font-size: 12px;
        color: var(--di);
        text-align: center;
        padding: 12px;
      }

      /* Quote */
      .nt-quote {
        text-align: center;
        max-width: 480px;
      }
      .nt-quote-text {
        font-size: 13px;
        color: var(--mu);
        font-style: italic;
        line-height: 1.6;
      }

      /* Status dot */
      .nt-status {
        position: fixed;
        bottom: 16px;
        right: 20px;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--di);
        user-select: none;
      }
      .nt-status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--di);
      }
      .nt-status-dot.online { background: #10b981; }

      /* Responsive */
      @media (max-width: 600px) {
        .nt-clock-time { font-size: 48px; }
        #root { padding: 28px 16px; gap: 24px; }
        .nt-action { padding: 8px 14px; font-size: 12px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="newtab.js"></script>
  </body>
</html>
