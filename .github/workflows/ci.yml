name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install ruff

      - name: Ruff lint
        run: ruff check aura/ api/ tests/ --select E,F,W --ignore E501,E402,F401
        continue-on-error: true

      - name: Ruff format check
        run: ruff format --check aura/ api/ tests/
        continue-on-error: true

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov numpy

      - name: Run tests
        run: |
          python -m pytest tests/ \
            --maxfail=10 \
            --ignore=tests/integration \
            --ignore=tests/test_active_inference.py \
            --ignore=tests/test_auth.py \
            --ignore=tests/test_api_routes.py \
            --ignore=tests/test_engineering_fixes.py \
            --ignore=tests/test_integration_pipeline.py \
            --ignore=tests/test_memory_persistence.py \
            --ignore=tests/test_mixins.py \
            --ignore=tests/test_proactive_awareness.py \
            --ignore=tests/test_reliability_upgrade.py \
            --ignore=tests/test_security.py \
            --ignore=tests/test_security_hardening.py \
            --ignore=tests/cli/test_display_functions.py \
            -q

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v3
