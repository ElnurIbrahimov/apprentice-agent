name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install ruff

      - name: Ruff lint
        run: ruff check aura/ api/ tests/ --select E,F,W --ignore E501,E402,F401,E741,E701,E712,E731,E721,F821

      - name: Ruff format check
        run: ruff format --check aura/ api/ tests/
        continue-on-error: true  # format is advisory, not blocking

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov numpy

      - name: Run unit tests
        run: |
          python -m pytest tests/ \
            --maxfail=10 \
            --ignore=tests/integration \
            -q

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ \
            --maxfail=5 \
            -q

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v3
