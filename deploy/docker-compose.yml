version: '3.8'

services:
  aura:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: aura-backend
    ports:
      - "127.0.0.1:8000:8000"  # Bind to localhost only — use Nginx for public access
    env_file:
      - ../.env
    environment:
      - AURA_ENV=production
      - AURA_API_AUTH_ENABLED=true
      - AURA_TRUST_PROXY=true
    volumes:
      # Persistent data (chromadb, knowledge, etc.)
      - aura-data:/opt/aura/data
      - aura-runtime:/opt/aura/aura_data
      - aura-logs:/opt/aura/logs
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G

  # Optional: Nginx reverse proxy with SSL
  # Uncomment if you want Docker to manage Nginx too
  #
  # nginx:
  #   image: nginx:1.27-alpine
  #   container_name: aura-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - certbot-etc:/etc/letsencrypt:ro
  #     - certbot-var:/var/lib/letsencrypt
  #   depends_on:
  #     - aura
  #   restart: always

volumes:
  aura-data:
  aura-runtime:
  aura-logs:
