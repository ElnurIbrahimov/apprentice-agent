# Nginx reverse proxy configuration for AURA
# 
# Place at: /etc/nginx/sites-available/aura (symlink to sites-enabled)
# Test with: nginx -t
# Reload:    systemctl reload nginx

# --- Upstream backend ---
upstream aura_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# --- HTTP → HTTPS redirect ---
server {
    listen 80;
    listen [::]:80;
    server_name aura-elnur.duckdns.org;  # CHANGE THIS to your domain

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS server ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aura-elnur.duckdns.org;  # CHANGE THIS to your domain

    # SSL configuration (managed by Certbot)
    ssl_certificate     /etc/letsencrypt/live/aura-elnur.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aura-elnur.duckdns.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers (reinforced at Nginx level)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client max body size — prevent oversized uploads
    client_max_body_size 10M;

    # Rate limiting — protect API from brute force
    limit_req_zone $binary_remote_addr zone=aura_api:10m rate=30r/s;
    limit_req zone=aura_api burst=50 nodelay;

    # WebSocket support — needed for real-time chat
    location /api/ws/ {
        limit_req zone=aura_api burst=100 nodelay;
        proxy_pass http://aura_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;    # Long-lived WS connections
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # API requests
    location /api/ {
        proxy_pass http://aura_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;       # AI responses can take time
    }

    # Frontend static assets (served by FastAPI or separate if CDN'd)
    location / {
        proxy_pass http://aura_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
