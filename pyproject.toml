[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aura"
version = "4.7.0"
description = "AURA - Autonomous Universal Reasoning Agent"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.4.0,<1.0.0",
    "requests>=2.31.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "psutil>=5.9.0,<7.0.0",
    "pyyaml>=6.0,<7.0",
    "tenacity>=8.2.0,<10.0.0",
    "rich>=13.0.0,<14.0.0",
    "prompt_toolkit>=3.0.0,<4.0.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0,<3.0.0",
    "numpy>=1.24.0,<3.0.0",
    "transformers>=4.40.0,<5.0.0",
    "accelerate>=0.25.0,<2.0.0",
    "sentence-transformers>=2.2.0,<4.0.0",
]
memory = [
    "networkx>=3.0,<4.0",
    "numpy>=1.24.0,<3.0.0",
    "kuzu>=0.4.0,<1.0.0",
    "faiss-cpu>=1.7.4",
]
telegram = [
    "python-telegram-bot>=20.0,<22.0",
]
api = [
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "websockets>=12.0,<14.0",
]
voice = [
    "pyttsx3>=2.90,<3.0",
    "sounddevice>=0.4.6,<1.0.0",
]
vision = [
    "torch>=2.0.0,<3.0.0",
    "transformers>=4.40.0,<5.0.0",
    "pillow>=10.0.0,<12.0.0",
]
tools = [
    "arxiv>=2.0.0,<3.0.0",
    "pymupdf>=1.23.0,<2.0.0",
    "pyperclip>=1.8.0,<2.0.0",
    "pillow>=10.0.0,<12.0.0",
    "imagehash>=4.3.0,<6.0.0",
    "mss>=9.0.0,<10.0.0",
]
calendar = [
    "icalendar>=5.0.0,<7.0.0",
    "recurring-ical-events>=3.0.0,<4.0.0",
    "python-dateutil>=2.8.0,<3.0.0",
]
treesitter = [
    "tree-sitter>=0.24.0,<1.0.0",
    "tree-sitter-language-pack>=0.13.0,<1.0.0",
]
windows = [
    "comtypes>=1.2.0,<2.0.0",
    "pycaw>=20230407",
    "winotify>=1.1.0,<2.0.0",
    "screen-brightness-control>=0.22.0,<1.0.0",
]
scheduler = [
    "apscheduler>=3.10.0,<4.0.0",
]
security = [
    "cryptography>=41.0.0,<44.0.0",
]
discord = [
    "discord.py>=2.3.0,<3.0.0",
]
matrix = [
    "matrix-nio>=0.24.0,<1.0.0",
]
all = [
    "aura[ml,memory,telegram,api,voice,vision,tools,calendar,treesitter,windows,scheduler,security,discord,matrix]",
]

[project.scripts]
aura = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["aura*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = ["-vv", "--strict-markers", "--tb=short", "--maxfail=3"]
markers = [
    "unit: unit tests (no external calls)",
    "integration: integration tests (may call real APIs unless mocked)",
    "slow: slow tests (>10s)",
    "llm: tests involving LLM calls (mocked)",
]
# timeout = 30  # requires pytest-timeout (pip install pytest-timeout)

[tool.coverage.run]
source = ["aura/"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*", "*/web/*"]

[tool.coverage.report]
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".git", ".venv", "dist", "build", "web/", "extension/"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort imports
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "RUF",   # ruff-specific
    "E722",  # bare-except detection
]
ignore = [
    "E501",  # line length (handled by formatter)
    "B008",  # function call in default argument
    "E741",  # ambiguous variable names
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "ARG"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["aura.security.*", "aura.memory.*", "aura.core.permissions"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.bandit]
exclude_dirs = ["tests", ".venv", "web", "extension"]
skips = ["B101"]
